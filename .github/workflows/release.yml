name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglib2.0-bin

      - name: Build extension package
        run: make zip

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: huge-clock@nightrunner91.github.io.zip
